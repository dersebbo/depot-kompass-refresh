name: Depot Kompass automatisch aktualisieren
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: depot-kompass-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Marktpreise, Recherche und Server-Verlauf aktualisieren
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base='https://lalinea-bonn.de/depot-kompass-sebbo-20260912/api/market.php';
          async function get(params,method='GET') {
            const r=await fetch(base+'?'+new URLSearchParams(params),{method,signal:AbortSignal.timeout(65000)});
            const d=await r.json(); if(!r.ok||!d.ok)throw Error('Backend HTTP '+r.status+' / '+(d.code||'data unavailable')); return d;
          }
          const universe=(await get({kind:'universe'})).data;
          const symbols=universe.stocks.map(x=>x.symbol),chunks=[];
          for(let i=0;i<symbols.length;i+=4)chunks.push(symbols.slice(i,i+4));
          let errors=0;
          async function pool(jobs,limit=3){let cursor=0;await Promise.all(Array.from({length:limit},async()=>{while(cursor<jobs.length){const job=jobs[cursor++];try{await job()}catch(e){errors++;console.warn(String(e.message));}}}));}
          // STRATO applies per-provider caching and quotas; keys never leave STRATO.
          for(const kind of ['quotes','history','targets','fundamentals']) {
            let count=0,missing=0,fresh=0;
            await pool(chunks.map(group=>async()=>{const d=await get({kind,symbols:group.join(',')});count+=Object.keys(d.data).length;fresh+=Object.values(d.data).filter(x=>Date.now()-Date.parse(x.fetchedAt)<3600000).length;missing+=(d.missing||[]).length;}));
            console.log(kind+': '+count+' results, '+missing+' unavailable');
            if(kind==='quotes'&&fresh<35)throw Error('Too few freshly fetched market quotes');
          }
          const groups=Math.ceil(universe.stocks.filter(x=>x.holding&&!x.isEtf).length/5);
          let newsFresh=0;
          await pool(Array.from({length:groups},(_,group)=>async()=>{const r=await get({kind:'news',group});if(Date.now()-Date.parse(r.data.fetchedAt)<3600000)newsFresh++;}));
          await get({kind:'crypto'});
          await get({kind:'benchmarks'});
          if(newsFresh<Math.min(5,groups))throw Error('News cache is stale');
          const d=(await get({kind:'heartbeat'},'POST')).data;
          console.log('Backend checked: '+d.checkedAt+'; valued positions: '+d.covered+'; news groups: '+newsFresh+'/'+groups);
          if(errors>5)throw Error('Multiple upstream failures: '+errors);
          // A monthly maintenance commit keeps GitHub's 60-day inactivity cutoff from disabling this public scheduler.
          const headers={Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const url='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/contents/maintenance.txt';
          const res=await fetch(url,{headers});const old=res.ok?await res.json():null;
          const month=new Date().toISOString().slice(0,7);
          if(!old||Buffer.from(old.content,'base64').toString().trim()!==month){
            const r=await fetch(url,{method:'PUT',headers,body:JSON.stringify({message:'Monthly scheduler maintenance [skip ci]',content:Buffer.from(month+'\n').toString('base64'),...(old?{sha:old.sha}:{})})});
            if(!r.ok)throw Error('Scheduler maintenance HTTP '+r.status);
          }
          JS
